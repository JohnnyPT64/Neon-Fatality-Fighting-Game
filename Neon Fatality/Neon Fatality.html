<title>NEON FATALITY</title>
<!--
  NEON BLADE — single-file build. Open directly in a browser, no server needed.[cite: 1]
  Structure of the script below:[cite: 1]
    • class Sound   — WebAudio chiptune sequencer + SFX (playStep = music pattern)[cite: 1]
    • CHARS         — per-fighter frame data (start/active/rec frames, dmg, range, knockback)[cite: 1]
    • ARCH          — selectable fighters adapted from the Requiem roster[cite: 1]
    • drawRosterFighter — palette-driven versus-game fighter sprites[cite: 1]
    • class Game    — 60fps fixed-step loop: input, AI, physics, hitboxes, finishers, HUD[cite: 1]
  Console tweaks: NEON.CHARS.kai.heavy.dmg = 40;  NEON.game.p2.hp = 1;[cite: 1]
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:#eee; font-family:VT323,monospace; font-size:20px;

  #menu { text-align:center; display:flex; flex-direction:column; gap:24px; align-items:center; }

  .fighter-selects { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; }

  .difficulty-options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .difficulty-option { min-width:130px; color:var(--cyan); }
  .difficulty-option[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); box-shadow:0 0 14px var(--gold); }
  #stageSelect { width:min(900px,96vw); display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center; }
  #stageSelect h2 { margin:0; color:var(--gold); font:16px "Press Start 2P"; text-shadow:3px 3px 0 var(--pink); }
  .stage-options { width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .stage-option { min-width:0; padding:8px; display:grid; gap:8px; justify-items:center; color:var(--cyan); border-color:#3a2350; }
  .stage-option canvas { width:100%; aspect-ratio:16/9; border:1px solid currentColor; box-shadow:none; }
  .stage-option[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); box-shadow:0 0 14px var(--gold); }
  .stage-option span { font-size:9px; line-height:1.5; }
  .stage-actions { display:flex; gap:12px; }
  #fightStart { background:var(--gold); color:#120; border-color:var(--gold); }
  @media (max-width:600px) { .stage-options { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .stage-option { padding:6px; } }
  #stage { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; overflow:hidden; z-index:5; }
  canvas { width:100%; display:block; image-rendering:pixelated; border:3px solid var(--cyan); box-shadow:0 0 24px var(--cyan); }
  #stage > #cv { width:100%; height:100%; border:0; box-shadow:none; object-fit:cover; }
  #pause { position:absolute; top:14px; right:14px; z-index:2; padding:8px 10px; color:var(--cyan); background:#1b0d2b; border-color:var(--cyan); font-size:10px; }
  #fullscreen { position:absolute; top:14px; right:94px; z-index:2; padding:8px 10px; color:var(--cyan); background:#1b0d2b; border-color:var(--cyan); font-size:10px; }
  #end { position:absolute; bottom:40px; left:0; right:0; display:flex; gap:12px; justify-content:center; }
  .help { color:var(--muted); }
  [hidden] { display:none !important; }

        gain.gain.value = group.gain;
        gain.connect(ctx.destination);
        for (const name of group.names) {

          source.connect(gain);

        }

    tone(f, d, type = "square", v = 0.2, f2, when, dest) {
      const ctx = this.ctx;
      if (!ctx)
        return;
      const t = when ?? ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);

        o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      o.connect(g);
      g.connect(dest ?? this.sfx);
      o.start(t);
      o.stop(t + d + 0.02);
    }
    noise(d, v, freq, type = "lowpass", when, dest, freq2) {
      const ctx = this.ctx;
      if (!ctx)
        return;
      const t = when ?? ctx.currentTime;
      const s = ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      const fl = ctx.createBiquadFilter();
      fl.type = type;
      fl.frequency.setValueAtTime(freq, t);
      if (freq2)
        fl.frequency.exponentialRampToValueAtTime(freq2, t + d);
      const g = ctx.createGain();
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      s.connect(fl);
      fl.connect(g);
      g.connect(dest ?? this.sfx);
      s.start(t);
      s.stop(t + d + 0.02);
    }
    startMusic(track = null) {
      if (!this.ctx)
        return;
      this.stopMusic();
      this.stageAudio = null;
      if (track) {

        audio.volume = track === "Street Justice.mp3" ? 0.12 : 0.2;
        this.stageAudio = audio;
        audio.play().catch(() => {});
        return;
      }
      this.step = 0;
      this.nextTime = this.ctx.currentTime + 0.05;
      this.timer = setInterval(() => this.sched(), 25);
    }
    resumeMusic() {
      if (this.stageAudio) {
        this.ctx?.resume();
        this.stageAudio.play().catch(() => {});
        return;
      }
      this.startMusic();
    }
    stopMusic() {
      if (this.timer)
        clearInterval(this.timer);
      this.timer = null;
      this.stageAudio?.pause();
    }
    sched() {
      const ctx = this.ctx;
      if (!ctx)
        return;
      while (this.nextTime < ctx.currentTime + 0.12) {
        this.playStep(this.step, this.nextTime);
        this.nextTime += 0.107;
        this.step++;
      }
    }
    playStep(s, t) {
      const m = this.music;
      const bass = [45, 45, 57, 45, 43, 43, 55, 43, 41, 41, 53, 41, 40, 40, 52, 44];
      const chords = [
        [69, 72, 76, 81],
        [67, 71, 74, 79],
        [65, 69, 72, 77],
        [64, 68, 71, 76]
      ];
      const bar = Math.floor(s / 16) % 4;
      if (s % 2 === 0)
        this.tone(midi(bass[(s >> 1) % 16]), 0.2, "square", 0.35, undefined, t, m);
      const ch = chords[bar];
      const arp = ch[s * 3 % 4] + (s % 8 > 5 ? 12 : 0);
      this.tone(midi(arp), 0.09, "triangle", 0.28, undefined, t, m);
      const mel = [76, 0, 74, 72, 0, 74, 76, 79, 77, 0, 76, 74, 72, 0, 71, 68];
      const mi = Math.floor(s / 4) % 16;
      if (s >= 64 && s % 4 === 0 && mel[mi])
        this.tone(midi(mel[mi]), 0.3, "square", 0.12, undefined, t, m);
      if (s % 8 === 0)
        this.tone(150, 0.15, "sine", 0.9, 40, t, m);
      if (s % 8 === 4)
        this.noise(0.12, 0.5, 1800, "bandpass", t, m);
      if (s % 2 === 1)
        this.noise(0.03, 0.18, 7000, "highpass", t, m);
    }
    light() {
      this.noise(0.06, 0.4, 3000, "highpass");
      this.tone(500, 0.06, "square", 0.08, 200);
    }
    playClip(name) {
      const audio = this.clips[name];
      if (!audio)
        return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
    heavy() {
      this.noise(0.14, 0.5, 1200, "lowpass", undefined, undefined, 300);
      this.tone(240, 0.12, "sawtooth", 0.1, 70);
    }
    hit(heavy) {
      this.noise(heavy ? 0.22 : 0.12, 0.9, heavy ? 1500 : 2500, "lowpass", undefined, undefined, 200);
      this.tone(heavy ? 160 : 220, heavy ? 0.25 : 0.12, "sine", 0.9, 35);
      this.tone(heavy ? 90 : 130, 0.08, "square", 0.25, 40);

    }

    }
    slash() {

    }
    charge() {

    }

      this.noise(1.6, 1, 3000, "lowpass", undefined, undefined, 60);
      this.tone(120, 1, "sine", 1, 25);
      this.tone(60, 0.8, "square", 0.3, 20);
    }
    ko() {
      this.tone(440, 0.6, "square", 0.2, 55);
    }
    fatality() {
      const ctx = this.ctx;
      if (!ctx)
        return;
      const t = ctx.currentTime;
      [57, 60, 64, 69].forEach((n, i) => this.tone(midi(n), 0.5, "square", 0.15, undefined, t + i * 0.12));
    }
    speak(text) {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.pitch = 0.2;
        u.rate = 0.8;
        u.volume = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } catch {}
    }
    destroy() {
      this.stopMusic();
    }

        c.fillRect(-10, -10, W + 20, H + 20);
      }
      const order = this.phase === "fatality" ? [this.loser, this.winner] : [this.p1, this.p2];
      for (const f of order)
        drawFighter(c, f, this.cameraX);
      for (const p of this.projs)
        this.drawProj(p);
      for (const p of this.parts) {
        c.globalAlpha = Math.min(1, p.life / 12);
        c.fillStyle = p.col;
        c.fillRect(Math.round(p.x - this.cameraX), Math.round(p.y), p.s, p.s);
        c.globalAlpha = 1;
      }
      for (const r of this.rings) {
        c.globalAlpha = r.life / 20;
        c.strokeStyle = r.col;
        c.lineWidth = 2;
        c.beginPath();
        c.arc(r.x - this.cameraX, r.y, r.r, 0, Math.PI * 2);
        c.stroke();
        c.globalAlpha = 1;
      }
      for (let i = 1;i < this.rain.length; i += 2) {
        const d = this.rain[i];
        line(c, d.x, d.y, d.x - d.l * 0.3, d.y + d.l, 1, "rgba(180,220,255,0.4)");
        if (d.y > GROUND - 6 && d.y < GROUND) {
          c.fillStyle = "rgba(200,230,255,0.5)";
          c.fillRect(Math.round(d.x) - 1, GROUND - 1, 3, 1);
        }
      }
      c.restore();
      if (this.flashA > 0) {
        c.fillStyle = `rgba(255,255,255,${this.flashA})`;
        c.fillRect(0, 0, W, H);
      }
      this.drawBar(this.p1, 12, false);
      this.drawBar(this.p2, W - 162, true);
      c.fillStyle = "#12051e";
      c.fillRect(W / 2 - 14, 4, 28, 22);
      c.strokeStyle = "#ffd23f";
      c.lineWidth = 1;
      c.shadowColor = "#ffd23f";
      c.shadowBlur = 6;
      c.strokeRect(W / 2 - 13.5, 4.5, 27, 21);
      c.shadowBlur = 0;
      this.text(String(this.timer).padStart(2, "0"), W / 2 + 1, 16, 12, this.timer <= 10 ? "#ff3b3b" : "#ffd23f", "center", 6);
      const pulse = 1 + Math.sin(this.gt * 0.3) * 0.04;
      const specialUser = [this.p1, this.p2].find((fighter) => fighter.atk === "special");
      if (specialUser)
        this.text(specialUser.data.special.name, W / 2, 126, 6, specialUser.data.special.color ?? specialUser.data.color, "center", 5);
      if (this.phase === "intro") {
        if (this.pt < 70)
          this.text(`ROUND ${this.round}`, W / 2, 90, 16, "#22e5ff", "center", 12);
        else
          this.text("FIGHT!", W / 2, 90, Math.round(24 * pulse), "#ffd23f", "center", 14);
      } else if (this.phase === "finish") {
        if (this.winner.wins >= 1) {
          const col = this.gt % 12 < 6 ? "#ff1a3c" : "#ffd23f";
          this.text("FINISH HIM!!", W / 2, 84, 18, col, "center", 14);
          if (this.winner.human && this.gt % 40 < 28)
            this.text("PRESS SPACE", W / 2, 108, 8, "#ffffff", "center", 6);
        }
      } else if (this.phase === "fatality" && this.pt > 130) {
        const s = Math.min(1, (this.pt - 130) / 10);
        const size = Math.round(28 * (2 - s) * (s === 1 ? pulse : 1));
        const flick = this.gt % 30 < 2;
        this.text("FATALITY!", W / 2, 84, size, flick ? "#ffffff" : "#ff1a3c", "center", 20);
        this.text("FATALITY!", W / 2, 84, size, flick ? "#ffffff" : "#ff1a3c", "center", 6, false);
        this.text(this.winner.data.finish.name, W / 2, 111, 5, this.winner.data.finish.color, "center", 5);
      } else if (this.phase === "ko") {
        this.text("K.O.", W / 2, 88, 28, "#ff1a3c", "center", 16);
      } else if (this.phase === "roundEnd" || this.phase === "matchEnd") {
        this.text(this.banner, W / 2, 84, 16, this.winner?.data.color ?? "#ffffff", "center", 12);
        if (this.winner?.wins === 2)
          this.text("FLAWLESS NEON VICTORY", W / 2, 106, 7, "#ffd23f", "center", 6);
      }
      if (this.paused) {
        c.fillStyle = "rgba(4,2,18,0.72)";
        c.fillRect(0, 0, W, H);
        this.text("PAUSED", W / 2, 88, 18, "#ffd23f", "center", 12);
        this.text("PRESS RESUME", W / 2, 112, 6, "#22e5ff", "center", 4);
      }
      c.fillStyle = "rgba(0,0,0,0.12)";
      for (let y = 0;y < H; y += 2)
        c.fillRect(0, y, W, 1);
    }
  }

  // entry.ts
  window.NEON = { CHARS };
  var $ = (id) => document.getElementById(id);
  var p1 = "kai";
  var p2 = "viper";
  var mode = "cpu";
  var selectedDifficulty = 2;
  var selectedStage = 0;
  var game = null;
  var sound = new Sound;
  var MAIN_MENU_MUSIC = "Main Menu.mp3";
  var hoveredMenuOption = null;
  function startMenuMusic() {
    if (!game && !$("menu").hidden && !sound.stageAudio)
      sound.startMusic(MAIN_MENU_MUSIC);
  }
  document.addEventListener("pointerover", (event) => {
    const option = event.target.closest("button, select");
    if (!option || option === hoveredMenuOption || option.contains(event.relatedTarget))
      return;
    hoveredMenuOption = option;
    sound.init();
    sound.playClip("menu_hover");
  });
  document.addEventListener("pointerout", (event) => {
    const option = event.target.closest("button, select");
    if (option && option === hoveredMenuOption && !option.contains(event.relatedTarget))
      hoveredMenuOption = null;
  });
  document.addEventListener("click", (event) => {
    const option = event.target.closest("button");
    if (!option || option.disabled)
      return;
    sound.init();
    sound.playClip("menu_select");
    startMenuMusic();
  }, true);
  document.addEventListener("change", (event) => {
    if (!(event.target instanceof HTMLSelectElement))
      return;
    sound.init();
    sound.playClip("menu_select");
    startMenuMusic();
  });
  for (const [id, fighter] of Object.entries(CHARS)) {
    for (const selector of [$("p1Char"), $("p2Char")]) {
      const option = document.createElement("option");
      option.value = id;
      option.textContent = fighter.name;
      selector.appendChild(option);
    }
  }
  for (const [index, stageData] of STAGES.entries()) {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "stage-option";
    option.setAttribute("aria-pressed", String(index === selectedStage));
    const preview = document.createElement("canvas");
    preview.width = 160;
    preview.height = 90;
    preview.setAttribute("aria-hidden", "true");
    const previewContext = preview.getContext("2d");
    previewContext.imageSmoothingEnabled = false;
    previewContext.drawImage(buildBackground(stageData.setting), 0, 0, preview.width, preview.height);
    const name = document.createElement("span");
    name.textContent = stageData.name;
    option.append(preview, name);
    option.onclick = () => {
      selectedStage = index;
      document.querySelectorAll(".stage-option").forEach((button, buttonIndex) => button.setAttribute("aria-pressed", String(buttonIndex === selectedStage)));
    };
    $("stageOptions").append(option);
  }
  $("p1Char").value = p1;
  $("p2Char").value = p2;
  $("p1Char").onchange = (event) => p1 = event.target.value;
  $("p2Char").onchange = (event) => p2 = event.target.value;
  document.addEventListener("keydown", (event) => {
    if (event.target instanceof HTMLSelectElement)
      return;
    if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key))
      return;
    const buttons = Array.from(document.querySelectorAll("#menu button, #stageSelect button, #end button"))
      .filter((button) => !button.closest("[hidden]"));
    if (!buttons.length)
      return;
    event.preventDefault();
    const current = buttons.indexOf(document.activeElement);
    if (current < 0) {
      buttons[0].focus();
      return;
    }
    const horizontal = event.key === "ArrowLeft" || event.key === "ArrowRight";
    const direction = event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 1;
    const currentRect = buttons[current].getBoundingClientRect();
    const currentMain = horizontal ? currentRect.left + currentRect.width / 2 : currentRect.top + currentRect.height / 2;
    const currentCross = horizontal ? currentRect.top + currentRect.height / 2 : currentRect.left + currentRect.width / 2;
    const candidates = buttons.map((button) => {
      const rect = button.getBoundingClientRect();
      const main = horizontal ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
      const cross = horizontal ? rect.top + rect.height / 2 : rect.left + rect.width / 2;
      return { button, mainDistance: (main - currentMain) * direction, crossDistance: Math.abs(cross - currentCross) };
    }).filter((candidate) => candidate.mainDistance > 0);
    candidates.sort((a, b) => a.mainDistance + a.crossDistance * 2 - b.mainDistance - b.crossDistance * 2);
    candidates[0]?.button.focus();
  });
  $("cv").addEventListener("click", () => {
    const canvas = $("cv");
    canvas.requestPointerLock?.()?.catch(() => {});
  });
  document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
  });
  document.querySelectorAll("[data-difficulty]").forEach((button) => button.onclick = () => {
    selectedDifficulty = Number(button.dataset.difficulty);
    document.querySelectorAll("[data-difficulty]").forEach((option) => option.setAttribute("aria-pressed", String(option === button)));
  });
  function showStageSelect() {
    $("difficultySelect").hidden = true;
    $("menu").hidden = true;
    $("stageSelect").hidden = false;
  }
  function showStartOptions() {
    $("menu").hidden = true;
    if (mode === "cpu") {
      $("difficultySelect").hidden = false;
      return;
    }
    showStageSelect();
  }
  function launchGame() {
    sound.init();
    game?.destroy();
    $("difficultySelect").hidden = true;
    $("stageSelect").hidden = true;
    $("menu").hidden = true;
    $("stage").hidden = false;
    $("end").hidden = true;
    $("pause").hidden = false;
    $("fullscreen").hidden = false;
    $("pause").textContent = "PAUSE";
    document.fonts.load('8px "Press Start 2P"').finally(() => {
      game = new Game($("cv"), sound, { p1, p2, mode, stage: selectedStage, difficulty: selectedDifficulty }, () => {
        $("end").hidden = false;
        $("pause").hidden = true;
        $("fullscreen").hidden = true;
      });
      window.NEON.game = game;
      game.start();
    });
  }
  $("start").onclick = showStartOptions;
  $("difficultyBack").onclick = () => {
    $("difficultySelect").hidden = true;
    $("menu").hidden = false;
  };
  $("difficultyNext").onclick = showStageSelect;
  $("stageBack").onclick = () => {
    $("stageSelect").hidden = true;
    if (mode === "cpu")
      $("difficultySelect").hidden = false;
    else
      $("menu").hidden = false;
  };
  $("fightStart").onclick = launchGame;
  $("rematch").onclick = launchGame;
  $("pause").onclick = () => {
    if (game)
      $("pause").textContent = game.togglePause() ? "RESUME" : "PAUSE";
  };
  $("fullscreen").onclick = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  };
  $("menuBtn").onclick = () => {
    game?.destroy();
    game = null;
    sound.startMusic(MAIN_MENU_MUSIC);
    $("pause").hidden = true;
    $("fullscreen").hidden = true;
    $("stage").hidden = true;
    $("difficultySelect").hidden = true;
    $("stageSelect").hidden = true;
    $("menu").hidden = false;
  };
})();

</script>
</body>
